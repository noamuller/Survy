name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # add these 4
  firebase_core: ^3.4.0
  firebase_messaging: ^15.0.3
  shared_preferences: ^2.2.3
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # <-- Add this here

flutter_icons: # <-- Add this section after dev_dependencies
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  # Add your assets folder if not already present
  assets:
    - assets/icon.png

